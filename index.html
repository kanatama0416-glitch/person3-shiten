<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f1">
<title>視展 — 03</title>
<style>html,body{margin:0;min-height:100%;background:#f4f4f1}</style>
</head>
<body>
<script>
(async()=>{
  try{
    let source=await(await fetch('https://raw.githubusercontent.com/kanatama0416-glitch/person3-shiten/271d3eddeec11d2f6c6cd896c74db8d775aacecd/index.html',{cache:'no-store'})).text();
    source=source.replace('</head>',`<style>
/* 03 cat-eye visual fix only. Cover the original eye interior completely so no white can show through. */
body.cat-ready .hero .eye,
body.cat-ready .secret-toggle{
  overflow:hidden!important;
  background:var(--p)!important;
  border-color:#111!important;
}
body.cat-ready .hero .iris,
body.cat-ready .secret-iris{
  opacity:0!important;
}
body.cat-ready .hero .eye::before,
body.cat-ready .secret-toggle::before{
  content:""!important;
  position:absolute!important;
  inset:0!important;
  display:block!important;
  background:var(--p)!important;
  border:0!important;
  box-shadow:none!important;
  z-index:20!important;
  pointer-events:none!important;
}
body.cat-ready .hero .eye::after,
body.cat-ready .secret-toggle::after{
  content:""!important;
  position:absolute!important;
  left:50%!important;
  top:50%!important;
  transform:translate(-50%,-50%)!important;
  display:block!important;
  background:#111!important;
  border:0!important;
  border-radius:999px!important;
  box-shadow:none!important;
  z-index:21!important;
  pointer-events:none!important;
}
body.cat-ready .hero .eye::after{
  width:6px!important;
  height:42px!important;
}
body.cat-ready .secret-toggle::after{
  width:4px!important;
  height:22px!important;
}
</style></head>`);
    source=source.replace('</body>','<script>document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("#secretToggle,#tearToggle");if(b)window.scrollTo(0,0)},true);<\/script><script src="https://kanatama0416-glitch.github.io/person1-shiten/eye-attract.js?v=pcfix-20260916"><\/script><script src="https://kanatama0416-glitch.github.io/person1-shiten/tease-overrides.js?v=42d0b943"><\/script></body>');
    document.open();document.write(source);document.close();
  }catch(e){
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui">ページを読み込めませんでした。</div>';
  }
})();
</script>
</body>
</html>
